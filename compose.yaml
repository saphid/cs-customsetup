# docker compose up -d   ->  http://<this machine>:8080
services:
  loadout:
    image: ghcr.io/saphid/loadout:latest
    build: .
    ports:
      - "8080:8080"
    volumes:
      - profiles:/data
    restart: unless-stopped
    environment:
      # The address phones and tournament PCs use to reach this machine.
      PUBLIC_URL: http://192.168.1.10:8080
volumes:
  profiles:
